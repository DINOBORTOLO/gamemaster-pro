<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameMaster - Dicas e Estratégias de Gaming</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e27;
            color: #fff;
            line-height: 1.6;
        }

        /* REAL-TIME DATA SECTION */
        .realtime-section {
            background: linear-gradient(135deg, #1a1f3a 0%, #2d1b69 100%);
            border-radius: 12px;
            padding: 24px;
            border: 1px solid rgba(124, 58, 237, 0.3);
            margin-bottom: 30px;
        }

        .realtime-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .realtime-title {
            font-size: 20px;
            font-weight: 700;
            color: #00d4ff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .realtime-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #00d4ff;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #00d4ff;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .realtime-filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .filter-label {
            font-size: 12px;
            color: #00d4ff;
            font-weight: 600;
            text-transform: uppercase;
        }

        .filter-select {
            padding: 10px;
            background: rgba(124, 58, 237, 0.1);
            border: 1px solid rgba(124, 58, 237, 0.3);
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }

        .filter-select:focus {
            outline: none;
            border-color: #00d4ff;
        }

        .filter-button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #00d4ff 0%, #7c3aed 100%);
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            align-self: flex-end;
        }

        .filter-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(124, 58, 237, 0.4);
        }

        .realtime-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(0, 212, 255, 0.05);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 24px;
            color: #00d4ff;
            font-weight: 700;
        }

        .realtime-table {
            overflow-x: auto;
            background: rgba(0, 212, 255, 0.05);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .realtime-table table {
            width: 100%;
            border-collapse: collapse;
        }

        .realtime-table th {
            background: rgba(124, 58, 237, 0.2);
            padding: 12px;
            text-align: left;
            color: #00d4ff;
            font-weight: 600;
            border-bottom: 1px solid rgba(124, 58, 237, 0.3);
            font-size: 12px;
            text-transform: uppercase;
        }

        .realtime-table td {
            padding: 12px;
            border-bottom: 1px solid rgba(124, 58, 237, 0.1);
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
        }

        .realtime-table tr:hover {
            background: rgba(124, 58, 237, 0.1);
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .badge-strategy {
            background: rgba(0, 212, 255, 0.2);
            color: #00d4ff;
        }

        .badge-news {
            background: rgba(255, 215, 0, 0.2);
            color: #ffd700;
        }

        .badge-product {
            background: rgba(76, 175, 80, 0.2);
            color: #4caf50;
        }

        .badge-coupon {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #00d4ff;
        }

        .loading::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }

        .error-message {
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid #ff6b6b;
            border-radius: 8px;
            padding: 15px;
            color: #ff6b6b;
            margin-bottom: 20px;
        }

        .success-message {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4caf50;
            border-radius: 8px;
            padding: 15px;
            color: #4caf50;
            margin-bottom: 20px;
        }

        .refresh-button {
            padding: 8px 16px;
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid #00d4ff;
            border-radius: 6px;
            color: #00d4ff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 12px;
        }

        .refresh-button:hover {
            background: rgba(0, 212, 255, 0.2);
        }

        .refresh-button.loading {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .pagination button {
            padding: 8px 12px;
            background: rgba(124, 58, 237, 0.1);
            border: 1px solid rgba(124, 58, 237, 0.3);
            border-radius: 4px;
            color: #00d4ff;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .pagination button:hover {
            background: rgba(124, 58, 237, 0.2);
        }

        .pagination button.active {
            background: linear-gradient(135deg, #00d4ff 0%, #7c3aed 100%);
            border-color: #00d4ff;
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: rgba(255, 255, 255, 0.5);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <!-- REAL-TIME DATA SECTION (Insert this into your admin dashboard) -->
    <div class="realtime-section" id="realtimeDataSection">
        <div class="realtime-header">
            <div class="realtime-title">
                <span>📡 Dados em Tempo Real</span>
            </div>
            <div class="realtime-status">
                <div class="status-dot"></div>
                <span>Conectado ao Backend</span>
            </div>
        </div>

        <!-- Filters -->
        <div class="realtime-filters">
            <div class="filter-group">
                <label class="filter-label">Jogo</label>
                <select class="filter-select" id="filterGame" onchange="applyFilters()">
                    <option value="">Todos os Jogos</option>
                    <option value="fortnite">Fortnite</option>
                    <option value="lol">League of Legends</option>
                    <option value="minecraft">Minecraft</option>
                </select>
            </div>

            <div class="filter-group">
                <label class="filter-label">Tipo</label>
                <select class="filter-select" id="filterType" onchange="applyFilters()">
                    <option value="">Todos os Tipos</option>
                    <option value="strategy">Estratégias</option>
                    <option value="news">Notícias</option>
                    <option value="product">Produtos</option>
                    <option value="coupon">Cupons</option>
                </select>
            </div>

            <div class="filter-group">
                <label class="filter-label">Nível</label>
                <select class="filter-select" id="filterLevel" onchange="applyFilters()">
                    <option value="">Todos os Níveis</option>
                    <option value="1">Iniciante (1-5)</option>
                    <option value="10">Intermediário (6-15)</option>
                    <option value="20">Avançado (16+)</option>
                </select>
            </div>

            <button class="filter-button" onclick="refreshData()">🔄 Atualizar</button>
        </div>

        <!-- Stats -->
        <div class="realtime-stats">
            <div class="stat-card">
                <div class="stat-label">Total de Itens</div>
                <div class="stat-value" id="totalItems">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Estratégias</div>
                <div class="stat-value" id="strategyCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Notícias</div>
                <div class="stat-value" id="newsCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Produtos</div>
                <div class="stat-value" id="productCount">0</div>
            </div>
        </div>

        <!-- Messages -->
        <div id="messageContainer"></div>

        <!-- Table -->
        <div class="realtime-table">
            <div id="loadingIndicator" class="loading" style="display: none;">Carregando dados</div>
            <table id="dataTable" style="display: none;">
                <thead>
                    <tr>
                        <th>Jogo</th>
                        <th>Tipo</th>
                        <th>Título</th>
                        <th>Nível</th>
                        <th>Detalhes</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
            <div id="emptyState" class="empty-state" style="display: none;">
                <div class="empty-state-icon">📭</div>
                <p>Nenhum dado encontrado</p>
            </div>
        </div>

        <!-- Pagination -->
        <div class="pagination" id="paginationContainer" style="display: none;"></div>
    </div>

    <script>
        // Configuration
        const API_URL = 'http://localhost:3001/api';
        let allData = [];
        let filteredData = [];
        let currentPage = 1;
        const itemsPerPage = 10;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            refreshData();
            // Auto-refresh every 30 seconds
            setInterval(refreshData, 30000);
        });

        async function refreshData() {
            showLoading(true);
            clearMessages();

            try {
                // Fetch games
                const gamesRes = await fetch(`${API_URL}/games`);
                const games = await gamesRes.json();

                allData = [];

                // Fetch data for each game
                for (const game of games) {
                    try {
                        const dataRes = await fetch(`${API_URL}/game/${game.id}?level=10`);
                        const gameData = await dataRes.json();

                        if (gameData.data) {
                            // Process strategies
                            if (gameData.data.strategies) {
                                gameData.data.strategies.forEach(item => {
                                    allData.push({
                                        game: game.name,
                                        gameId: game.id,
                                        type: 'strategy',
                                        title: item.title,
                                        level: item.level,
                                        details: `Estratégia de nível ${item.level}`
                                    });
                                });
                            }

                            // Process news
                            if (gameData.data.news) {
                                gameData.data.news.forEach(item => {
                                    allData.push({
                                        game: game.name,
                                        gameId: game.id,
                                        type: 'news',
                                        title: item.title,
                                        level: item.level,
                                        details: `Notícia de nível ${item.level}`
                                    });
                                });
                            }

                            // Process products
                            if (gameData.data.products) {
                                gameData.data.products.forEach(item => {
                                    allData.push({
                                        game: game.name,
                                        gameId: game.id,
                                        type: 'product',
                                        title: item.title,
                                        level: item.level,
                                        details: `$${item.price} - Nível ${item.level}`
                                    });
                                });
                            }

                            // Process coupons
                            if (gameData.data.coupons) {
                                gameData.data.coupons.forEach(item => {
                                    allData.push({
                                        game: game.name,
                                        gameId: game.id,
                                        type: 'coupon',
                                        title: item.code,
                                        level: item.level,
                                        details: `${item.discount} de desconto`
                                    });
                                });
                            }
                        }
                    } catch (err) {
                        console.error(`Erro ao buscar dados de ${game.name}:`, err);
                    }
                }

                showSuccess(`✅ ${allData.length} itens carregados com sucesso!`);
                applyFilters();

            } catch (error) {
                console.error('Erro ao buscar dados:', error);
                showError('❌ Erro ao conectar ao backend. Verifique se o servidor está rodando em http://localhost:3001');
            } finally {
                showLoading(false);
            }
        }

        function applyFilters() {
            const gameFilter = document.getElementById('filterGame').value;
            const typeFilter = document.getElementById('filterType').value;
            const levelFilter = document.getElementById('filterLevel').value;

            filteredData = allData.filter(item => {
                if (gameFilter && item.gameId !== gameFilter) return false;
                if (typeFilter && item.type !== typeFilter) return false;
                if (levelFilter) {
                    const level = parseInt(levelFilter);
                    if (level === 1 && item.level > 5) return false;
                    if (level === 10 && (item.level < 6 || item.level > 15)) return false;
                    if (level === 20 && item.level < 16) return false;
                }
                return true;
            });

            currentPage = 1;
            updateStats();
            renderTable();
        }

        function updateStats() {
            const stats = {
                total: allData.length,
                strategies: allData.filter(d => d.type === 'strategy').length,
                news: allData.filter(d => d.type === 'news').length,
                products: allData.filter(d => d.type === 'product').length
            };

            document.getElementById('totalItems').textContent = stats.total;
            document.getElementById('strategyCount').textContent = stats.strategies;
            document.getElementById('newsCount').textContent = stats.news;
            document.getElementById('productCount').textContent = stats.products;
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            const table = document.getElementById('dataTable');
            const emptyState = document.getElementById('emptyState');
            const paginationContainer = document.getElementById('paginationContainer');

            if (filteredData.length === 0) {
                table.style.display = 'none';
                emptyState.style.display = 'block';
                paginationContainer.style.display = 'none';
                return;
            }

            table.style.display = 'table';
            emptyState.style.display = 'none';

            // Pagination
            const totalPages = Math.ceil(filteredData.length / itemsPerPage);
            const startIdx = (currentPage - 1) * itemsPerPage;
            const endIdx = startIdx + itemsPerPage;
            const pageData = filteredData.slice(startIdx, endIdx);

            // Render rows
            tbody.innerHTML = pageData.map(item => `
                <tr>
                    <td>${item.game}</td>
                    <td><span class="badge badge-${item.type}">${getTypeLabel(item.type)}</span></td>
                    <td>${item.title}</td>
                    <td>Nível ${item.level}</td>
                    <td>${item.details}</td>
                    <td>
                        <button class="refresh-button" onclick="copyToClipboard('${item.title}')">📋 Copiar</button>
                    </td>
                </tr>
            `).join('');

            // Render pagination
            if (totalPages > 1) {
                paginationContainer.style.display = 'flex';
                paginationContainer.innerHTML = '';

                for (let i = 1; i <= totalPages; i++) {
                    const btn = document.createElement('button');
                    btn.textContent = i;
                    btn.className = i === currentPage ? 'active' : '';
                    btn.onclick = () => {
                        currentPage = i;
                        renderTable();
                    };
                    paginationContainer.appendChild(btn);
                }
            } else {
                paginationContainer.style.display = 'none';
            }
        }

        function getTypeLabel(type) {
            const labels = {
                strategy: '⚔️ Estratégia',
                news: '📰 Notícia',
                product: '🛍️ Produto',
                coupon: '🎟️ Cupom'
            };
            return labels[type] || type;
        }

        function showLoading(show) {
            document.getElementById('loadingIndicator').style.display = show ? 'block' : 'none';
        }

        function showError(message) {
            const container = document.getElementById('messageContainer');
            container.innerHTML = `<div class="error-message">${message}</div>`;
        }

        function showSuccess(message) {
            const container = document.getElementById('messageContainer');
            container.innerHTML = `<div class="success-message">${message}</div>`;
            setTimeout(() => {
                container.innerHTML = '';
            }, 5000);
        }

        function clearMessages() {
            document.getElementById('messageContainer').innerHTML = '';
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showSuccess('✅ Copiado para a área de transferência!');
            });
        }
    </script>
</body>
</html>
