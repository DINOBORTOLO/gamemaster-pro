<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameMaster - Dicas e Estratégias de Gaming</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e27;
            color: #fff;
            line-height: 1.6;
        }

        /* SEARCH SECTION STYLES */
        .search-section {
            width: 100%;
            padding: 40px 20px;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            min-height: 100vh;
        }

        .search-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .search-header {
            text-align: center;
            margin-bottom: 40px;
            color: #fff;
        }

        .search-header h1 {
            font-size: 42px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #00d4ff 0%, #7c3aed 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .search-header p {
            font-size: 18px;
            color: #b0b0b0;
        }

        .search-box {
            background: rgba(124, 58, 237, 0.1);
            border: 2px solid #7c3aed;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 0 50px rgba(124, 58, 237, 0.2);
        }

        .search-input {
            width: 100%;
            padding: 15px 20px;
            background: rgba(124, 58, 237, 0.1);
            border: 1px solid #7c3aed;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: #00d4ff;
            background: rgba(124, 58, 237, 0.2);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .search-filters {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-select {
            padding: 10px 15px;
            background: rgba(124, 58, 237, 0.2);
            border: 1px solid #7c3aed;
            border-radius: 5px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-select:hover {
            border-color: #00d4ff;
            background: rgba(124, 58, 237, 0.3);
        }

        .filter-btn {
            padding: 10px 20px;
            background: rgba(124, 58, 237, 0.2);
            border: 1px solid #7c3aed;
            border-radius: 5px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .filter-btn:hover {
            background: linear-gradient(135deg, #00d4ff 0%, #7c3aed 100%);
            border-color: #00d4ff;
        }

        .suggestions-box {
            background: rgba(26, 31, 58, 0.95);
            border: 1px solid #7c3aed;
            border-radius: 0 0 8px 8px;
            max-height: 300px;
            overflow-y: auto;
            z-index: 1000;
        }

        .suggestions-box.hidden {
            display: none;
        }

        .suggestions-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .suggestion-item {
            padding: 12px 20px;
            border-bottom: 1px solid rgba(124, 58, 237, 0.2);
            cursor: pointer;
            transition: all 0.2s ease;
            color: #b0b0b0;
        }

        .suggestion-item:hover {
            background: rgba(124, 58, 237, 0.3);
            color: #00d4ff;
            padding-left: 30px;
        }

        .results-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .game-card {
            background: linear-gradient(135deg, rgba(124, 58, 237, 0.1) 0%, rgba(0, 212, 255, 0.1) 100%);
            border: 2px solid #7c3aed;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.2);
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: #00d4ff;
            box-shadow: 0 8px 25px rgba(0, 212, 255, 0.3);
        }

        .game-card-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .game-card-title {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 8px;
        }

        .game-card-genre {
            font-size: 12px;
            color: #00d4ff;
            margin-bottom: 10px;
        }

        .game-card-stats {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #b0b0b0;
            margin-bottom: 15px;
        }

        .game-card-description {
            font-size: 13px;
            color: #b0b0b0;
            line-height: 1.4;
            margin-bottom: 15px;
        }

        .game-card-btn {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #00d4ff 0%, #7c3aed 100%);
            border: none;
            border-radius: 5px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .game-card-btn:hover {
            transform: scale(1.05);
        }

        .game-portfolio {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            overflow-y: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .game-portfolio.hidden {
            display: none;
        }

        .portfolio-content {
            background: linear-gradient(135deg, #1a1f3a 0%, #2d1b69 100%);
            border: 2px solid #7c3aed;
            border-radius: 15px;
            padding: 40px;
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .close-portfolio-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid #ff6b6b;
            color: #ff6b6b;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s ease;
            z-index: 2001;
        }

        .close-portfolio-btn:hover {
            background: rgba(255, 107, 107, 0.4);
        }

        .portfolio-header {
            display: flex;
            gap: 30px;
            margin-bottom: 30px;
            align-items: center;
        }

        .portfolio-icon {
            font-size: 80px;
        }

        .portfolio-info h1 {
            font-size: 36px;
            color: #fff;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #00d4ff 0%, #7c3aed 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .portfolio-meta {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .meta-badge {
            background: rgba(124, 58, 237, 0.3);
            border: 1px solid #7c3aed;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            color: #00d4ff;
        }

        .portfolio-description {
            background: rgba(124, 58, 237, 0.1);
            border-left: 3px solid #00d4ff;
            padding: 20px;
            margin-bottom: 30px;
            border-radius: 5px;
            color: #b0b0b0;
            line-height: 1.6;
        }

        .portfolio-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid rgba(124, 58, 237, 0.3);
            flex-wrap: wrap;
        }

        .portfolio-tab {
            padding: 12px 20px;
            background: transparent;
            border: none;
            color: #b0b0b0;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
        }

        .portfolio-tab:hover {
            color: #00d4ff;
        }

        .portfolio-tab.active {
            color: #00d4ff;
            border-bottom-color: #00d4ff;
        }

        .portfolio-tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .portfolio-tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .guides-list, .strategies-list {
            list-style: none;
            padding: 0;
        }

        .guides-list li, .strategies-list li {
            padding: 12px 15px;
            background: rgba(124, 58, 237, 0.1);
            border-left: 3px solid #00d4ff;
            margin-bottom: 10px;
            border-radius: 5px;
            color: #b0b0b0;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .guides-list li:hover, .strategies-list li:hover {
            background: rgba(124, 58, 237, 0.2);
            color: #00d4ff;
            padding-left: 20px;
        }

        .updates-list {
            background: rgba(124, 58, 237, 0.1);
            border-left: 3px solid #00d4ff;
            padding: 20px;
            border-radius: 5px;
            color: #b0b0b0;
            line-height: 1.8;
        }

        .quiz-container {
            background: rgba(124, 58, 237, 0.1);
            border: 2px solid #7c3aed;
            padding: 20px;
            border-radius: 8px;
        }

        .quiz-question {
            color: #fff;
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .quiz-option {
            padding: 12px 15px;
            background: rgba(124, 58, 237, 0.2);
            border: 1px solid #7c3aed;
            border-radius: 5px;
            color: #b0b0b0;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .quiz-option:hover {
            background: rgba(124, 58, 237, 0.4);
            color: #00d4ff;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #b0b0b0;
            font-size: 18px;
        }

        @media (max-width: 768px) {
            .search-header h1 {
                font-size: 28px;
            }

            .portfolio-header {
                flex-direction: column;
                text-align: center;
            }

            .portfolio-info h1 {
                font-size: 24px;
            }

            .results-container {
                grid-template-columns: 1fr;
            }
        }
    </style>

                        <option value="FPS">FPS</option>
                        <option value="RPG">RPG</option>

            </div>

            <!-- SUGESTÕES EM TEMPO REAL -->
            <div id="suggestionsBox" class="suggestions-box hidden">
                <div id="suggestionsList" class="suggestions-list"></div>
            </div>
        </div>

        <!-- RESULTADOS DA BUSCA -->
        <div class="search-results">
            <div id="resultsContainer" class="results-container">
                <div class="no-results">
                    <p>🎮 Digite para buscar jogos...</p>
                </div>
            </div>
        </div>

        <!-- PORTFÓLIO DO JOGO SELECIONADO -->
        <div id="gamePortfolio" class="game-portfolio hidden">
            <div class="portfolio-content">
                <button class="close-portfolio-btn" onclick="closePortfolio()">✕ Fechar</button>
                
                <div class="portfolio-header">

                        </div>
                    </div>
                </div>

                <div class="portfolio-description">
                    <p id="portfolioDescription"></p>
                </div>

                <div class="portfolio-tabs">
                    <button class="portfolio-tab active" onclick="switchPortfolioTab('guides')">📖 Guias</button>
                    <button class="portfolio-tab" onclick="switchPortfolioTab('strategies')">⚔️ Estratégias</button>
                    <button class="portfolio-tab" onclick="switchPortfolioTab('updates')">📈 Atualizações</button>
                    <button class="portfolio-tab" onclick="switchPortfolioTab('quiz')">❓ Quiz</button>
                </div>

                <div id="guidesTab" class="portfolio-tab-content active">

                </div>

                <div id="strategiesTab" class="portfolio-tab-content">

                    <h3>❓ Quiz Relâmpago</h3>

        </div>

        ];

        let currentGamePortfolio = null;

        // Função de busca em tempo real
        function performSearch() {
            const query = document.getElementById('searchInput').value;
            const genre = document.getElementById('genreFilter').value;
            const platform = document.getElementById('platformFilter').value;

            let results = gamesDatabase;

            if (query) {
                results = results.filter(game =>
                    game.name.toLowerCase().includes(query.toLowerCase()) ||
                    game.genre.toLowerCase().includes(query.toLowerCase()) ||
                    game.description.toLowerCase().includes(query.toLowerCase())
                );
            }

            if (genre) {
                results = results.filter(game =>
                    game.genre.toLowerCase().includes(genre.toLowerCase())
                );
            }

            if (platform) {
                results = results.filter(game =>
                    game.platform.includes(platform)
                );
            }

            displayResults(results);
            displaySuggestions(results.slice(0, 5));
        }

        // Exibir resultados
        function displayResults(games) {
            const container = document.getElementById('resultsContainer');

            if (games.length === 0) {
                container.innerHTML = '<div class="no-results">❌ Nenhum jogo encontrado</div>';
                return;
            }

            container.innerHTML = games.map(game => `
                <div class="game-card" onclick="openPortfolio(${game.id})">
                    <div class="game-card-icon">${game.icon}</div>
                    <div class="game-card-title">${game.name}</div>
                    <div class="game-card-genre">${game.genre}</div>
                    <div class="game-card-stats">
                        <span>👥 ${game.players}</span>
                        <span>⭐ ${game.rating}</span>
                    </div>
                    <div class="game-card-description">${game.description}</div>
                    <button class="game-card-btn">📖 Ver Portfólio</button>
                </div>
            `).join('');
        }

        // Exibir sugestões
        function displaySuggestions(games) {
            const box = document.getElementById('suggestionsBox');
            const list = document.getElementById('suggestionsList');

            if (games.length === 0 || !document.getElementById('searchInput').value) {
                box.classList.add('hidden');
                return;
            }

            list.innerHTML = games.map(game => `
                <li class="suggestion-item" onclick="selectSuggestion('${game.name}')">${game.icon} ${game.name}</li>
            `).join('');

            box.classList.remove('hidden');
        }

        // Selecionar sugestão
        function selectSuggestion(gameName) {
            document.getElementById('searchInput').value = gameName;
            document.getElementById('suggestionsBox').classList.add('hidden');
            performSearch();
        }

        // Abrir portfólio do jogo
        function openPortfolio(gameId) {
            const game = gamesDatabase.find(g => g.id === gameId);
            if (!game) return;

            currentGamePortfolio = game;

            document.getElementById('portfolioIcon').textContent = game.icon;
            document.getElementById('portfolioTitle').textContent = game.name;
            document.getElementById('portfolioGenre').textContent = game.genre;
            document.getElementById('portfolioPlayers').textContent = `👥 ${game.players}`;
            document.getElementById('portfolioRating').textContent = `⭐ ${game.rating}`;
            document.getElementById('portfolioDescription').textContent = game.description;

            document.getElementById('guidesList').innerHTML = game.guides
                .map(guide => `<li>📖 ${guide}</li>`)
                .join('');

            document.getElementById('strategiesList').innerHTML = game.strategies
                .map(strategy => `<li>⚔️ ${strategy}</li>`)
                .join('');

            document.getElementById('updatesList').textContent = game.updates;

            generateQuiz(game);

            document.getElementById('gamePortfolio').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        // Fechar portfólio
        function closePortfolio() {
            document.getElementById('gamePortfolio').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        // Trocar aba do portfólio
        function switchPortfolioTab(tabName) {
            document.querySelectorAll('.portfolio-tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.portfolio-tab').forEach(btn => {
                btn.classList.remove('active');
            });

            document.getElementById(tabName + 'Tab').classList.add('active');
            event.target.classList.add('active');
        }

        // Gerar quiz
        function generateQuiz(game) {
            const quizzes = {
                'Fortnite': [{question: 'Qual é o nome da temporada atual?', options: ['Temporada 3', 'Temporada 2', 'Temporada 4', 'Temporada 1'], correct: 0, points: 10}],
                'Minecraft': [{question: 'Qual é o bloco mais raro do Minecraft?', options: ['Diamante', 'Esmeralda', 'Netherite', 'Ouro'], correct: 2, points: 15}],
                'League of Legends': [{question: 'Qual é o objetivo principal do jogo?', options: ['Destruir o Nexo inimigo', 'Matar todos os inimigos', 'Ganhar ouro', 'Subir de nível'], correct: 0, points: 10}],
                'Counter-Strike 2': [{question: 'Qual é o objetivo do time Terrorista?', options: ['Plantar a bomba', 'Defender o site', 'Ganhar rodadas', 'Matar todos'], correct: 0, points: 10}]
            };

            const gameQuizzes = quizzes[game.name] || [];
            const container = document.getElementById('quizContainer');

            if (gameQuizzes.length === 0) {
                container.innerHTML = '<p style="color: #b0b0b0;">Quiz em breve para este jogo!</p>';
                return;
            }

            container.innerHTML = gameQuizzes.map((quiz, idx) => `
                <div class="quiz-question">${idx + 1}. ${quiz.question}</div>
                <div class="quiz-options">
                    ${quiz.options.map((option, optIdx) => `
                        <button class="quiz-option" onclick="answerQuiz(${idx}, ${optIdx}, ${quiz.correct}, ${quiz.points})">
                            ${option}
                        </button>
                    `).join('')}
                </div>
            `).join('');
        }

        // Responder quiz
        function answerQuiz(quizIdx, optionIdx, correct, points) {
            if (optionIdx === correct) {
                alert(`✅ Correto! +${points} pontos!`);
            } else {
                alert('❌ Incorreto! Tente novamente!');
            }
        }

        // Event listeners
        document.getElementById('searchInput').addEventListener('input', performSearch);
        document.getElementById('genreFilter').addEventListener('change', performSearch);
        document.getElementById('platformFilter').addEventListener('change', performSearch);

        document.getElementById('trendingBtn').addEventListener('click', () => {
            const trending = gamesDatabase.filter(g => g.trending);
            displayResults(trending);
        });

        document.getElementById('topBtn').addEventListener('click', () => {
            displayResults(gamesDatabase.slice(0, 10));
        });

        // Fechar portfólio ao clicar fora
        document.getElementById('gamePortfolio').addEventListener('click', (e) => {
            if (e.target.id === 'gamePortfolio') {
                closePortfolio();
            }
        });
    </script>
